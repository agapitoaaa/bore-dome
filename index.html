<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bore Dome</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#cfe;font-family:monospace;overflow:hidden}
  canvas{display:block;margin:0 auto;background:#0b1020;touch-action:none;max-width:100%}
</style>
</head>
<body>
<canvas id="c" width="640" height="480"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = c.width, H = c.height, cx = W / 2, cy = H - 20, DR = 46;
let blobs, shots, parts, score, hp, t, over, aim = -Math.PI / 2, cooldown, best = +localStorage.getItem('boredome') || 0;
const WORDS = ['zzz', 'meh', 'ugh', 'idle', 'eh', 'yawn', 'nap'];

function reset() { blobs = []; shots = []; parts = []; score = 0; hp = 5; t = 0; over = false; cooldown = 0; }
reset();

function pointer(e) {
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  aim = Math.min(-0.1, Math.max(-Math.PI + 0.1, Math.atan2(y - cy, x - cx)));
}
c.addEventListener('pointermove', pointer);
c.addEventListener('pointerdown', e => { pointer(e); if (over) reset(); else fire(); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') aim = Math.max(-Math.PI + 0.1, aim - 0.1);
  if (e.key === 'ArrowRight') aim = Math.min(-0.1, aim + 0.1);
  if (e.key === ' ') { e.preventDefault(); over ? reset() : fire(); }
});

function fire() {
  if (cooldown > 0) return;
  cooldown = 8;
  shots.push({ x: cx + Math.cos(aim) * DR, y: cy + Math.sin(aim) * DR, vx: Math.cos(aim) * 9, vy: Math.sin(aim) * 9 });
}
function burst(x, y, col) {
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * 6.28, s = Math.random() * 3 + 1;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, col });
  }
}

function update() {
  if (over) return;
  t++; cooldown--;
  if (t % Math.max(15, 60 - Math.floor(score / 5)) === 0) {
    const big = Math.random() < 0.2;
    const x = 30 + Math.random() * (W - 60), a = Math.atan2(cy - 0, cx - x);
    const sp = 0.6 + Math.min(1.5, score / 60) + Math.random() * 0.4;
    blobs.push({ x, y: -20, vx: Math.cos(a) * sp * 0.4, vy: sp, r: big ? 22 : 14, hp: big ? 3 : 1, w: WORDS[Math.random() * WORDS.length | 0] });
  }
  for (const s of shots) { s.x += s.vx; s.y += s.vy; }
  shots = shots.filter(s => s.x > 0 && s.x < W && s.y > 0);
  for (const b of blobs) {
    b.x += b.vx; b.y += b.vy;
    for (const s of shots) {
      if (!s.dead && Math.hypot(b.x - s.x, b.y - s.y) < b.r + 3) { s.dead = true; b.hp--; burst(s.x, s.y, '#fe8'); }
    }
    if (b.hp <= 0) { b.dead = true; score += b.r > 15 ? 3 : 1; burst(b.x, b.y, '#8fc'); }
    else if (Math.hypot(b.x - cx, b.y - cy) < b.r + DR) { b.dead = true; hp--; burst(b.x, b.y, '#f66'); if (hp <= 0) { over = true; if (score > best) { best = score; localStorage.setItem('boredome', best); } } }
  }
  shots = shots.filter(s => !s.dead);
  blobs = blobs.filter(b => !b.dead);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.life--; }
  parts = parts.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 40; i++) ctx.fillRect((i * 97) % W, (i * 53) % (H - 80), 1.5, 1.5);
  // dome
  ctx.beginPath(); ctx.arc(cx, cy, DR, Math.PI, 0);
  ctx.fillStyle = '#16334a'; ctx.fill(); ctx.strokeStyle = '#5cf'; ctx.lineWidth = 3; ctx.stroke();
  // cannon
  ctx.strokeStyle = '#fe8'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(aim) * (DR + 12), cy + Math.sin(aim) * (DR + 12)); ctx.stroke();
  ctx.fillStyle = '#fe8'; for (const s of shots) { ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, 7); ctx.fill(); }
  ctx.textAlign = 'center'; ctx.font = '12px monospace';
  for (const b of blobs) {
    ctx.fillStyle = b.hp > 1 ? '#a6c' : '#c68'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(b.w, b.x, b.y + 4);
  }
  for (const p of parts) { ctx.globalAlpha = p.life / 30; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 3, 3); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#cfe'; ctx.textAlign = 'left'; ctx.font = '16px monospace';
  ctx.fillText('Score ' + score + '  Best ' + best, 10, 22);
  ctx.textAlign = 'right'; ctx.fillText('Dome ' + '♥'.repeat(Math.max(0, hp)), W - 10, 22);
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '32px monospace';
    ctx.fillText('Boredom wins.', cx, cy / 2 + 20);
    ctx.font = '16px monospace'; ctx.fillText('Click / space to try again', cx, cy / 2 + 50);
  } else if (t < 240) {
    ctx.fillStyle = '#9ab'; ctx.textAlign = 'center';
    ctx.fillText('Aim with mouse or ←/→ · click or space to fire', cx, H - 90);
  }
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
